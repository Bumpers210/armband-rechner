name: Validate signed production Android release

on:
  push:
    branches:
      - release/production-app-signing
    paths:
      - ".github/workflows/android-production-build.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"

permissions:
  contents: read

concurrency:
  group: android-production-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-signed-production-release:
    runs-on: ubuntu-latest
    environment: carma-production-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare protected production signing material
        shell: bash
        env:
          CARMAJA_ANDROID_KEYSTORE_BASE64: ${{ secrets.CARMAJA_ANDROID_KEYSTORE_BASE64 }}
          CARMAJA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CARMAJA_ANDROID_KEYSTORE_PASSWORD }}
          CARMAJA_ANDROID_KEY_ALIAS: ${{ secrets.CARMAJA_ANDROID_KEY_ALIAS }}
          CARMAJA_ANDROID_KEY_PASSWORD: ${{ secrets.CARMAJA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CARMAJA_ANDROID_KEYSTORE_BASE64}"
          test -n "${CARMAJA_ANDROID_KEYSTORE_PASSWORD}"
          test "${CARMAJA_ANDROID_KEY_ALIAS}" = "carmaja-product-management-production"
          test -n "${CARMAJA_ANDROID_KEY_PASSWORD}"

          keystore="${RUNNER_TEMP}/carmaja-product-management-production.p12"
          umask 077
          printf '%s' "${CARMAJA_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          test -s "${keystore}"
          chmod 600 "${keystore}"
          printf 'CARMAJA_PRODUCTION_KEYSTORE_PATH=%s\n' "${keystore}" >> "${GITHUB_ENV}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Enable KVM for the isolated emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run Compose instrumentation tests in isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew connectedDebugAndroidTest

      - name: Build signed production release APK
        env:
          CARMAJA_PRODUCTION_STORE_PASSWORD: ${{ secrets.CARMAJA_ANDROID_KEYSTORE_PASSWORD }}
          CARMAJA_PRODUCTION_KEY_PASSWORD: ${{ secrets.CARMAJA_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signed production APK
        shell: bash
        run: |
          set -euo pipefail

          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          aapt="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          expected_certificate_sha256="17FBAD15D1682B173314A860530B3895790AAA7C83EEA40DD792F268AE298944"
          test -f "${apk}"
          test -x "${apksigner}"
          test -x "${aapt}"

          "${apksigner}" verify --verbose "${apk}" >/dev/null
          certificate_sha256="$("${apksigner}" verify --print-certs "${apk}" \
            | awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ { print toupper($2) }')"
          test "${certificate_sha256}" = "${expected_certificate_sha256}"

          badging="$("${aapt}" dump badging "${apk}")"
          grep -Fq "package: name='de.carmajaperlen.armbandrechner'" <<<"${badging}"
          grep -Fq "versionCode='1'" <<<"${badging}"
          grep -Fq "versionName='1.0.0'" <<<"${badging}"
          grep -Fq "application-label:'Carmaja-Perlen Produktverwaltung'" <<<"${badging}"

          apk_strings="$(mktemp)"
          trap 'rm -f "${apk_strings}"' EXIT
          unzip -p "${apk}" 'classes*.dex' resources.arsc | strings > "${apk_strings}"

          grep -Fqx 'https://api.carmaja-perlen.de/' "${apk_strings}"
          ! grep -Fq 'https://test-api.carmaja-perlen.de/' "${apk_strings}"
          ! grep -Fq 'de.carmajaperlen.armbandrechner.test' "${apk_strings}"
          ! grep -Fq 'Carmaja-Perlen Produktverwaltung Test' "${apk_strings}"
          ! grep -Fq -- '-beta' "${apk_strings}"
          ! grep -Fq 'de.steinhart.armbandrechner' "${apk_strings}"

          echo "SIGNED_PRODUCTION_APK_VALIDATION_OK"

      - name: Prepare signed production artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          apk="app/build/outputs/apk/release/app-release.apk"
          artifact_apk="artifact/Carmaja-Perlen-Produktverwaltung-1.0.0-signed.apk"
          cp "${apk}" "${artifact_apk}"
          sha256sum "${artifact_apk}" > "${artifact_apk}.sha256"
          cat > artifact/VALIDATION.txt <<'EOF'
          App-Name: Carmaja-Perlen Produktverwaltung
          Paketname: de.carmajaperlen.armbandrechner
          Version: 1.0.0
          VersionCode: 1
          Produkt-API: https://api.carmaja-perlen.de/
          Zertifikat-SHA-256: 17FBAD15D1682B173314A860530B3895790AAA7C83EEA40DD792F268AE298944
          Signatur: production PKCS12 release artifact
          EOF

      - name: Upload signed production APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carmaja-Perlen-Produktverwaltung-1.0.0-signed
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
