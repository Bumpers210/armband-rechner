name: Deploy guarded production website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-website.yml"
      - "website/content/products.json"
      - "website/public/images/products/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-website.yml"
      - "website/app/**"
      - "website/components/**"
      - "website/config/**"
      - "website/content/products.json"
      - "website/content/products.ts"
      - "website/content/site-content.ts"
      - "website/lib/**"
      - "website/public/**"
      - "website/scripts/prepare-production-deploy.mjs"
      - "website/scripts/bootstrap-production-first-deploy.sh"
      - "website/scripts/production-first-deploy-inventory.v1"
      - "website/scripts/deploy-production-site.sh"
      - "website/scripts/run-production-deployment.sh"
      - "website/scripts/verify-production-export.mjs"
      - "website/tests/node/production-*.test.mjs"
      - "website/tests/shell/**"
      - "website/.gitignore"
      - "website/eslint.config.mjs"
      - "website/next.config.ts"
      - "website/package.json"
      - "website/package-lock.json"
      - "website/tsconfig.json"
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: "Exakter Commit-SHA, der bereitgestellt werden soll"
        required: true
        type: string
      deployment_confirmation:
        description: "Zur Bestaetigung exakt DEPLOY-CARMAJA-PRODUCTION eingeben"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: carmaja-production-website
  cancel-in-progress: false

env:
  CARMAJA_REPOSITORY: Bumpers210/armband-rechner
  CARMAJA_PRODUCTION_BRANCH: main
  CARMAJA_SITE_TARGET: production
  CARMAJA_SITE_DOMAIN: www.carmaja-perlen.de
  CARMAJA_SITE_URL: https://www.carmaja-perlen.de
  CARMAJA_PRODUCTION_WEBROOT: /home/www/carmaja
  CARMAJA_PRODUCTION_DEPLOY_WORKSPACE: /home/www/carmaja-production-deploy
  CARMAJA_PRODUCTION_PUBLISH_ENABLED: "false"
  CARMAJA_PRODUCTION_DEPLOY_ENABLED: "false"

jobs:
  build-production-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARMAJA_PULL_REQUEST_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
      CARMAJA_PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    defaults:
      run:
        working-directory: website
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
      archive-sha256: ${{ steps.package.outputs.archive-sha256 }}

    steps:
      - name: Check out exact production candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Guard repository, allowed build branches and production locks
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "$CARMAJA_REPOSITORY"
          case "$GITHUB_EVENT_NAME" in
            push)
              test "$GITHUB_REF" = "refs/heads/main"
              test "$GITHUB_REF_NAME" = "$CARMAJA_PRODUCTION_BRANCH"
              ;;
            pull_request)
              test "$GITHUB_BASE_REF" = "$CARMAJA_PRODUCTION_BRANCH"
              test "$CARMAJA_PULL_REQUEST_BASE_REPOSITORY" = "$CARMAJA_REPOSITORY"
              test "$CARMAJA_PULL_REQUEST_HEAD_REPOSITORY" = "$CARMAJA_REPOSITORY"
              test -n "$GITHUB_HEAD_REF"
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              test "$GITHUB_REF_NAME" = "$CARMAJA_PRODUCTION_BRANCH"
              ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CARMAJA_SITE_TARGET" = "production"
          test "$CARMAJA_SITE_DOMAIN" = "www.carmaja-perlen.de"
          test "$CARMAJA_PRODUCTION_WEBROOT" = "/home/www/carmaja"
          test "$CARMAJA_PRODUCTION_DEPLOY_WORKSPACE" = "/home/www/carmaja-production-deploy"
          test "$CARMAJA_PRODUCTION_PUBLISH_ENABLED" = "false"
          test "$CARMAJA_PRODUCTION_DEPLOY_ENABLED" = "false"

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint production website and deployment sources
        run: npm run lint

      - name: Run production website and deployment tests
        run: npm test

      - name: Build and verify production export
        run: npm run build

      - name: Exclude separately managed production hosting files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(realpath out)" = "$GITHUB_WORKSPACE/website/out"
          rm -rf -- \
            out/.htaccess \
            out/.htaccess.publish.example \
            out/click.php \
            out/pageview.php \
            out/_internal \
            out/private-data \
            out/statistik

      - name: Bind release to workflow commit
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'release-id=%s\n' "$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Scan sources and create production deployment manifest
        env:
          CARMAJA_RELEASE_ID: ${{ steps.release.outputs.release-id }}
          CARMAJA_MANIFEST_SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$CARMAJA_MANIFEST_SOURCE_BRANCH" = "$CARMAJA_PRODUCTION_BRANCH" \
            || test "$CARMAJA_MANIFEST_SOURCE_BRANCH" = "release/production-product-management"
          GITHUB_REF_NAME="$CARMAJA_MANIFEST_SOURCE_BRANCH" npm run prepare:production-deploy

      - name: Package only verified production export
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -C out -czf .production-deploy-package/site.tar.gz .
          ARCHIVE_SHA256="$(sha256sum .production-deploy-package/site.tar.gz | awk '{print $1}')"
          printf '%s  site.tar.gz\n' "$ARCHIVE_SHA256" > .production-deploy-package/site.tar.gz.sha256
          printf 'archive-sha256=%s\n' "$ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload verified production deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carmaja-Produktion-Website-${{ github.sha }}
          path: |
            website/.production-deploy-package/manifest.tsv
            website/.production-deploy-package/site.tar.gz
            website/.production-deploy-package/site.tar.gz.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  validate-manual-production-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: carmaja-production
    env:
      CARMAJA_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      CARMAJA_DEPLOYMENT_CONFIRMATION: ${{ inputs.deployment_confirmation }}
      CARMAJA_PRODUCTION_DEPLOY_ENABLED: ${{ vars.CARMAJA_PRODUCTION_DEPLOY_ENABLED }}

    steps:
      - name: Validate explicit manual production deployment request
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "$CARMAJA_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "$CARMAJA_PRODUCTION_BRANCH"
          test "$CARMAJA_EXPECTED_COMMIT_SHA" = "$GITHUB_SHA"
          test "$CARMAJA_DEPLOYMENT_CONFIRMATION" = "DEPLOY-CARMAJA-PRODUCTION"
          test "$CARMAJA_PRODUCTION_PUBLISH_ENABLED" = "false"
          test "$CARMAJA_PRODUCTION_DEPLOY_ENABLED" = "true"

  deploy-production-site:
    needs:
      - build-production-site
      - validate-manual-production-deploy
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_name == 'main' && inputs.expected_commit_sha == github.sha && inputs.deployment_confirmation == 'DEPLOY-CARMAJA-PRODUCTION' && vars.CARMAJA_PRODUCTION_DEPLOY_ENABLED == 'true' && needs.validate-manual-production-deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: carmaja-production
      url: https://www.carmaja-perlen.de/
    defaults:
      run:
        working-directory: website
    env:
      CARMAJA_PRODUCTION_DEPLOY_ENABLED: ${{ vars.CARMAJA_PRODUCTION_DEPLOY_ENABLED }}
      CARMAJA_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      CARMAJA_DEPLOYMENT_CONFIRMATION: ${{ inputs.deployment_confirmation }}
      CARMAJA_PRODUCTION_SSH_HOST: ${{ secrets.CARMAJA_PRODUCTION_SSH_HOST }}
      CARMAJA_PRODUCTION_SSH_USER: ${{ secrets.CARMAJA_PRODUCTION_SSH_USER }}
      CARMAJA_PRODUCTION_SSH_PORT: ${{ secrets.CARMAJA_PRODUCTION_SSH_PORT }}
      CARMAJA_PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.CARMAJA_PRODUCTION_SSH_PRIVATE_KEY }}
      CARMAJA_PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.CARMAJA_PRODUCTION_SSH_KNOWN_HOSTS }}

    steps:
      - name: Check out exact deployment script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified production artifact
        uses: actions/download-artifact@v4
        with:
          name: Carmaja-Produktion-Website-${{ github.sha }}
          path: website/.production-deploy-package

      - name: Guard every deployment target before server access
        shell: bash
        env:
          CARMAJA_RELEASE_ID: ${{ needs.build-production-site.outputs.release-id }}
          CARMAJA_ARCHIVE_SHA256: ${{ needs.build-production-site.outputs.archive-sha256 }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "Bumpers210/armband-rechner"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$CARMAJA_EXPECTED_COMMIT_SHA" = "$GITHUB_SHA"
          test "$CARMAJA_DEPLOYMENT_CONFIRMATION" = "DEPLOY-CARMAJA-PRODUCTION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CARMAJA_SITE_TARGET" = "production"
          test "$CARMAJA_SITE_DOMAIN" = "www.carmaja-perlen.de"
          test "$CARMAJA_PRODUCTION_WEBROOT" = "/home/www/carmaja"
          test "$CARMAJA_PRODUCTION_DEPLOY_WORKSPACE" = "/home/www/carmaja-production-deploy"
          test "$CARMAJA_PRODUCTION_PUBLISH_ENABLED" = "false"
          test "$CARMAJA_PRODUCTION_DEPLOY_ENABLED" = "true"
          test "$CARMAJA_RELEASE_ID" = "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "${#CARMAJA_ARCHIVE_SHA256}" -eq 64
          printf '%s\n' 'DEPLOY_GUARD_OK=identity'
          test -n "$CARMAJA_PRODUCTION_SSH_HOST"
          test -n "$CARMAJA_PRODUCTION_SSH_USER"
          test -n "$CARMAJA_PRODUCTION_SSH_PRIVATE_KEY"
          test -n "$CARMAJA_PRODUCTION_SSH_KNOWN_HOSTS"
          printf '%s\n' 'DEPLOY_GUARD_OK=ssh_secrets_present'
          [[ "$CARMAJA_PRODUCTION_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$CARMAJA_PRODUCTION_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "${CARMAJA_PRODUCTION_SSH_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          test "$((10#${CARMAJA_PRODUCTION_SSH_PORT:-22}))" -ge 1
          test "$((10#${CARMAJA_PRODUCTION_SSH_PORT:-22}))" -le 65535
          printf '%s\n' 'DEPLOY_GUARD_OK=ssh_secret_shapes'
          test "$(find .production-deploy-package -maxdepth 1 -type f | wc -l)" -eq 3
          (
            cd .production-deploy-package
            sha256sum -c site.tar.gz.sha256
          )
          test "$(sha256sum .production-deploy-package/site.tar.gz | awk '{print $1}')" = "$CARMAJA_ARCHIVE_SHA256"
          printf '%s\n' 'DEPLOY_GUARD_OK=artifact_integrity'
          grep -Fx "$(printf 'meta\trepository\tBumpers210/armband-rechner')" .production-deploy-package/manifest.tsv
          grep -Fx "$(printf 'meta\tbranch\tmain')" .production-deploy-package/manifest.tsv
          grep -Fx "$(printf 'meta\ttarget\tproduction')" .production-deploy-package/manifest.tsv
          grep -Fx "$(printf 'meta\tdomain\twww.carmaja-perlen.de')" .production-deploy-package/manifest.tsv
          grep -Fx "$(printf 'meta\twebroot\t/home/www/carmaja')" .production-deploy-package/manifest.tsv
          grep -Fx "$(printf 'meta\tworkspace\t/home/www/carmaja-production-deploy')" .production-deploy-package/manifest.tsv
          printf '%s\n' 'DEPLOY_GUARD_OK=manifest_metadata'
          ! awk -F '\t' '
            $1 == "file" && ($4 ~ /(^|\/)(\.htaccess|click\.php|products\.json|private-data|_internal|statistik)(\/|$)/ || $4 ~ /\.php$/) {
              prohibited = 1
            }
            END { exit prohibited ? 0 : 1 }
          ' .production-deploy-package/manifest.tsv
          printf '%s\n' 'DEPLOY_GUARD_OK=manifest_paths'

      - name: Prepare pinned SSH client
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          private_key_payload=${CARMAJA_PRODUCTION_SSH_PRIVATE_KEY//$'\r'/}
          private_key_payload=${private_key_payload//$'\n'/}
          private_key_payload=${private_key_payload#$'\xEF\xBB\xBF'}
          private_key_payload_length=${#private_key_payload}
          known_hosts_payload=${CARMAJA_PRODUCTION_SSH_KNOWN_HOSTS//$'\r'/}
          known_hosts_payload=${known_hosts_payload#$'\xEF\xBB\xBF'}
          printf 'SSH_PRIVATE_KEY_BASE64_LENGTH=%s\n' "$private_key_payload_length"
          if [[ ! "$private_key_payload" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            printf '%s\n' 'Production SSH key secret is not canonical Base64.' >&2
            exit 1
          fi
          printf '%s' "$private_key_payload" | base64 --decode > "$HOME/.ssh/carmaja_production_deploy"
          printf '%s\n' "$known_hosts_payload" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/carmaja_production_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/carmaja_production_deploy" > /dev/null
          ssh-keygen -F "$CARMAJA_PRODUCTION_SSH_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null \
            || ssh-keygen -F "[$CARMAJA_PRODUCTION_SSH_HOST]:${CARMAJA_PRODUCTION_SSH_PORT:-22}" -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Verify remote production paths and required tools without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${CARMAJA_PRODUCTION_SSH_PORT:-22}"
          REMOTE="${CARMAJA_PRODUCTION_SSH_USER}@${CARMAJA_PRODUCTION_SSH_HOST}"
          ssh \
            -i "$HOME/.ssh/carmaja_production_deploy" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$REMOTE" \
            'set -eu
             for cmd in awk cmp cp date dirname find grep head ls mkdir mv realpath rm rmdir sed sha256sum sort tar tr uniq wc; do
               command -v "$cmd" >/dev/null
             done
             test "$(realpath /home/www/carmaja)" = /home/www/carmaja
             test -d /home/www/carmaja
             test -w /home/www/carmaja
             test "$(realpath /home/www)" = /home/www
             if test -e /home/www/carmaja-production-deploy; then
               test "$(realpath /home/www/carmaja-production-deploy)" = /home/www/carmaja-production-deploy
             fi'

      - name: Create isolated production deployment workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${CARMAJA_PRODUCTION_SSH_PORT:-22}"
          REMOTE="${CARMAJA_PRODUCTION_SSH_USER}@${CARMAJA_PRODUCTION_SSH_HOST}"
          ssh \
            -i "$HOME/.ssh/carmaja_production_deploy" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$REMOTE" \
            'set -eu
             umask 027
             mkdir -p \
               /home/www/carmaja-production-deploy/incoming \
               /home/www/carmaja-production-deploy/releases \
               /home/www/carmaja-production-deploy/backups \
               /home/www/carmaja-production-deploy/state \
               /home/www/carmaja-production-deploy/locks
             chmod 0750 \
               /home/www/carmaja-production-deploy \
               /home/www/carmaja-production-deploy/incoming \
               /home/www/carmaja-production-deploy/releases \
               /home/www/carmaja-production-deploy/backups \
               /home/www/carmaja-production-deploy/state \
               /home/www/carmaja-production-deploy/locks
             test "$(realpath /home/www/carmaja-production-deploy)" = /home/www/carmaja-production-deploy'

      - name: Upload production export into isolated incoming directory
        shell: bash
        env:
          CARMAJA_RELEASE_ID: ${{ needs.build-production-site.outputs.release-id }}
        run: |
          set -Eeuo pipefail
          PORT="${CARMAJA_PRODUCTION_SSH_PORT:-22}"
          REMOTE="${CARMAJA_PRODUCTION_SSH_USER}@${CARMAJA_PRODUCTION_SSH_HOST}"
          SCP=(
            scp
            -i "$HOME/.ssh/carmaja_production_deploy"
            -P "$PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          "${SCP[@]}" .production-deploy-package/site.tar.gz \
            "$REMOTE:carmaja-production-deploy/incoming/${CARMAJA_RELEASE_ID}.tar.gz"
          "${SCP[@]}" .production-deploy-package/site.tar.gz.sha256 \
            "$REMOTE:carmaja-production-deploy/incoming/${CARMAJA_RELEASE_ID}.tar.gz.sha256"
          "${SCP[@]}" .production-deploy-package/manifest.tsv \
            "$REMOTE:carmaja-production-deploy/incoming/${CARMAJA_RELEASE_ID}.manifest.tsv"

      - name: Activate, smoke-test and mark verified
        shell: bash
        env:
          CARMAJA_RELEASE_ID: ${{ needs.build-production-site.outputs.release-id }}
          CARMAJA_ARCHIVE_SHA256: ${{ needs.build-production-site.outputs.archive-sha256 }}
        run: bash scripts/run-production-deployment.sh

  reset-production-deploy-gate:
    needs:
      - build-production-site
      - validate-manual-production-deploy
      - deploy-production-site
    if: ${{ github.event_name == 'workflow_dispatch' && always() && vars.CARMAJA_PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: carmaja-production
    permissions: {}
    steps:
      - name: Disable production deployment independently of result
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CARMAJA_PRODUCTION_VARIABLES_TOKEN }}
          script: |
            await github.rest.actions.updateRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "CARMAJA_PRODUCTION_DEPLOY_ENABLED",
              value: "false",
            });
