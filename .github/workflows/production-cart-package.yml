name: Validate production cart package

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-cart-package.yml'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cart-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Pinned historical programs are used only by the synthetic hotfix tests.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, gd, exif, pdo, pdo_mysql, pdo_sqlite, sodium, curl, openssl, intl
          coverage: none
      - name: Install locked dependencies
        working-directory: website
        run: npm ci
      - name: Website contracts and security audit
        working-directory: website
        run: |
          npm run lint:test
          npm test
          npm audit --audit-level=moderate
      - name: PHP regression without provider or database connections
        shell: bash
        run: |
          set -euo pipefail
          # Reproduce the path-only POSIX fixture on this disposable runner,
          # never on IONOS. Refuse to reuse or modify any existing directory.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          fixture_root='/home/www/carmaja-private-test'
          test ! -e "$fixture_root"
          test ! -L "$fixture_root"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$fixture_root"
          trap 'sudo rmdir "$fixture_root"' EXIT
          test "$(realpath "$fixture_root")" = "$fixture_root"
          for test_file in website/tests/php/*-test.php; do
            # These two suites require the historical fixture prepared below.
            case "$test_file" in
              */product-maintenance-activation-test.php|*/product-maintenance-guard-test.php) continue ;;
            esac
            printf '\nPHP suite: %s\n' "$test_file"
            php "$test_file"
          done
          CARMAJA_TEST_PHP="$(command -v php)" \
            CARMAJA_TEST_PHP_EXT="$(php -r 'echo ini_get("extension_dir");')" \
            node website/scripts/test-product-maintenance-hotfix.mjs
      - name: Artificial production website build (never deployable)
        run: node website/scripts/check-production-cart-build.mjs
      - name: Build complete allowlisted private package
        run: node website/scripts/prepare-production-cart-package.mjs build website/.production-cart-package
      - name: Lint packaged PHP and verify package integrity
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find website/.production-cart-package -type f -name '*.php' -print0)
          node website/scripts/prepare-production-cart-package.mjs verify website/.production-cart-package
          git diff --check
      - name: Upload private-code release candidate (no credentials)
        uses: actions/upload-artifact@v4
        with:
          name: Carmaja-Warenkorb-Produktionspaket-${{ github.sha }}
          path: website/.production-cart-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
